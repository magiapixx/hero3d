<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magiapix — Digital Studio</title>
    <meta
      name="description"
      content="Magiapix is a digital studio shaping brands, websites and interactive experiences with strategy, design and code."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316112b'/%3E%3Cpath fill='%23fff' d='M7 24l5-16h3l-5 16zm6 0l5-16h3l-5 16z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.className = "js"
    </script>
  </head>

  <!-- `loading` draws the overlay + bar loader in base.css; main.ts drops it once the bars exist -->
  <body class="loading">
    <main>
      <!-- Scroll stage: taller than the screen, with the hero pinned inside it. Scrolling through the
           extra height plays the hero's exit (HeroScroll + the exit block in base.css). -->
      <div id="hero-stage" class="hero-stage">
        <section id="hero" class="hero" aria-labelledby="hero-title">
          <div class="hero__lines" aria-hidden="true">
            <span class="hero__line hero__line--v1"></span>
            <span class="hero__line hero__line--v2"></span>
            <span class="hero__line hero__line--h1"></span>
            <span class="hero__line hero__line--h2"></span>
          </div>

          <header class="hero__header">
            <a class="logo reveal" href="./" aria-label="Magiapix — home">
              <span class="logo__word">Magiapix</span>
              <svg class="logo__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 20 9 4h3L7 20zm6.5 0 5-16h3l-5 16z" />
              </svg>
            </a>
            <nav class="menu" aria-label="Main">
              <a class="menu__link reveal" href="#work" style="--i: 1">Work</a>
              <a class="menu__link reveal" href="#services" style="--i: 2">Services</a>
              <a class="menu__link reveal" href="#contact" style="--i: 3">Let’s talk</a>
            </nav>
          </header>

          <p class="hero__tagline reveal" style="--i: 4">Digital studio<br />design × code</p>
          <p class="hero__scroll reveal" style="--i: 4">Scroll down</p>

          <h1 id="hero-title" class="hero__title reveal" style="--i: 2">
            <span class="hero__title-line">Meet</span>
            <span class="hero__title-line">Magiapix</span>
          </h1>
          <p class="hero__lead reveal" style="--i: 3">
            <span class="hero__lead-ink">Magiapix shapes digital experiences,</span> blending strategy, design and code
            into brands, websites and interactive worlds—turning every visit into
            <span class="hero__lead-accent">lasting impact.</span>
          </p>
        </section>
      </div>
    </main>
    <script type="module" src="./js/main.ts"></script>
  </body>
</html>
